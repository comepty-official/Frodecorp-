<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Editor — Frodecorp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/editor.css" />
</head>
<body>

  <div id="loadingScreen" class="loading-screen">
    <div class="loading-logo">Frodecorp</div>
    <div class="loading-spinner"></div>
  </div>

  <div id="appContent" style="display:none;">
    <nav class="editor-nav">
      <a href="dashboard.html" class="nav-back">← Dashboard</a>
      <div class="nav-logo">Portfolio Editor</div>
      <div class="nav-actions">
        <button class="btn-save" id="saveBtn">
          <span id="saveLabel">Save portfolio</span>
          <span id="saveSpinner" class="spinner" style="display:none;"></span>
        </button>
      </div>
    </nav>

    <div class="editor-layout">
      <!-- LEFT: Form -->
      <div class="editor-form" id="editorForm">

        <!-- Toast -->
        <div class="toast" id="toast"></div>

        <!-- Profile section -->
        <section class="form-section">
          <h2 class="section-heading">Profile</h2>

          <div class="avatar-upload">
            <div class="avatar-preview" id="avatarPreview">
              <span id="avatarInitials">?</span>
              <img id="avatarImg" src="" alt="" style="display:none;" />
            </div>
            <div class="avatar-upload-info">
              <button class="btn-upload" id="uploadAvatarBtn">Upload photo</button>
              <p>JPG, PNG or WebP · Max 5MB</p>
            </div>
            <input type="file" id="avatarInput" accept="image/*" style="display:none;" />
          </div>

          <div class="form-group">
            <label>Full name <span class="req">*</span></label>
            <input type="text" id="fullName" placeholder="Amara Osei" data-preview="previewName" />
          </div>
          <div class="form-group">
            <label>Professional title</label>
            <input type="text" id="title" placeholder="UI/UX Designer & Frontend Developer" data-preview="previewTitle" />
          </div>
          <div class="form-group">
            <label>Portfolio slug <span class="req">*</span></label>
            <div class="slug-input-wrapper">
              <span class="slug-prefix">frodecorp/</span>
              <input type="text" id="slug" placeholder="amara-osei" />
            </div>
            <p class="field-hint">Letters, numbers, and hyphens only</p>
          </div>
        </section>

        <!-- About section -->
        <section class="form-section">
          <h2 class="section-heading">About</h2>
          <div class="form-group">
            <label>Bio</label>
            <textarea id="about" rows="5" placeholder="I'm a product designer with 5+ years of experience building digital products for startups and enterprises..." data-preview="previewAbout"></textarea>
          </div>
        </section>

        <!-- Skills section -->
        <section class="form-section">
          <h2 class="section-heading">Skills</h2>
          <div class="form-group">
            <label>Add skill</label>
            <div class="tag-input-row">
              <input type="text" id="skillInput" placeholder="e.g. React, Figma, Python" />
              <button class="btn-add" id="addSkillBtn">Add</button>
            </div>
          </div>
          <div class="tags-container" id="skillTags"></div>
        </section>

        <!-- Projects section -->
        <section class="form-section">
          <h2 class="section-heading">Projects</h2>
          <div id="projectsList"></div>
          <button class="btn-add-section" id="addProjectBtn">+ Add project</button>
        </section>

        <!-- Social links -->
        <section class="form-section">
          <h2 class="section-heading">Social Links</h2>
          <div class="form-group">
            <label>GitHub</label>
            <input type="url" id="github" placeholder="https://github.com/username" />
          </div>
          <div class="form-group">
            <label>LinkedIn</label>
            <input type="url" id="linkedin" placeholder="https://linkedin.com/in/username" />
          </div>
          <div class="form-group">
            <label>Twitter / X</label>
            <input type="url" id="twitter" placeholder="https://twitter.com/username" />
          </div>
          <div class="form-group">
            <label>Website</label>
            <input type="url" id="website" placeholder="https://yourwebsite.com" />
          </div>
        </section>

        <!-- Contact -->
        <section class="form-section">
          <h2 class="section-heading">Contact</h2>
          <div class="form-group">
            <label>Contact email</label>
            <input type="email" id="contactEmail" placeholder="hello@example.com" />
          </div>
          <div class="form-group">
            <label>Location</label>
            <input type="text" id="location" placeholder="Lagos, Nigeria" />
          </div>
        </section>

        <!-- Theme -->
        <section class="form-section">
          <h2 class="section-heading">Theme</h2>
          <div class="theme-grid" id="themeGrid">
            <button class="theme-btn active" data-theme="violet" style="--tc:#5b4cf5;">
              <div class="theme-swatch" style="background:#5b4cf5;"></div>
              <span>Violet</span>
            </button>
            <button class="theme-btn" data-theme="ocean" style="--tc:#0ea5e9;">
              <div class="theme-swatch" style="background:#0ea5e9;"></div>
              <span>Ocean</span>
            </button>
            <button class="theme-btn" data-theme="forest" style="--tc:#10b981;">
              <div class="theme-swatch" style="background:#10b981;"></div>
              <span>Forest</span>
            </button>
            <button class="theme-btn" data-theme="sunset" style="--tc:#f97316;">
              <div class="theme-swatch" style="background:#f97316;"></div>
              <span>Sunset</span>
            </button>
            <button class="theme-btn" data-theme="rose" style="--tc:#f43f5e;">
              <div class="theme-swatch" style="background:#f43f5e;"></div>
              <span>Rose</span>
            </button>
            <button class="theme-btn" data-theme="slate" style="--tc:#475569;">
              <div class="theme-swatch" style="background:#475569;"></div>
              <span>Slate</span>
            </button>
          </div>
        </section>

        <div class="form-bottom">
          <button class="btn-save-bottom" id="saveBtn2">Save & publish portfolio</button>
        </div>

      </div>

      <!-- RIGHT: Preview -->
      <div class="editor-preview" id="editorPreview">
        <div class="preview-label">Live Preview</div>
        <div class="preview-frame" id="previewFrame">

          <div class="pv-header" id="previewHeader">
            <div class="pv-avatar" id="previewAvatar">
              <span id="previewAvatarInitials">?</span>
              <img id="previewAvatarImg" src="" alt="" style="display:none;" />
            </div>
            <h1 class="pv-name" id="previewName">Your Name</h1>
            <p class="pv-title" id="previewTitle">Your Title</p>
          </div>

          <div class="pv-section">
            <div class="pv-section-label">About</div>
            <p class="pv-about" id="previewAbout">Your bio will appear here…</p>
          </div>

          <div class="pv-section">
            <div class="pv-section-label">Skills</div>
            <div class="pv-skills" id="previewSkills"></div>
          </div>

          <div class="pv-section">
            <div class="pv-section-label">Projects</div>
            <div class="pv-projects" id="previewProjects"></div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/editor.js"></script>
</body>
</html>
