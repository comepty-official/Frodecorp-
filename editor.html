<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor - Frodecorp</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/editor.css">
</head>
<body>

<div id="loadingScreen" class="loading-screen">
    <div class="loader"></div>
</div>

<div id="appContent" class="editor-page" style="display:none;">

    <header class="editor-header">
        <div class="header-left">
            
            <h1>Editor</h1>
        </div>

        <button id="saveBtn" class="save-btn">
            Save Changes
        </button>
    </header>

    <div class="editor-container">

        <aside class="editor-sidebar">

            <div class="settings-card">

                <div class="profile-area">
                    <div class="avatar-box">
                        <img id="avatarImg" alt="">
                        <span id="avatarInitials">W</span>
                    </div>

                    <input type="file" id="avatarInput" hidden>

                    <button id="uploadAvatarBtn" class="secondary-btn">
                        Change Photo
                    </button>
                </div>

            </div>

            <div class="settings-card">
                <h3>Profile Information</h3>

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" placeholder="John Doe">
                </div>

                <div class="form-group">
                    <label>Professional Title</label>
                    <input type="text" id="title" placeholder="Frontend Developer">
                </div>

                <div class="form-group">
                    <label>Portfolio URL</label>
                    <input type="text" id="slug" placeholder="john-doe">
                </div>

                <div class="form-group">
                    <label>About</label>
                    <textarea id="about" rows="5" placeholder="Tell people about yourself..."></textarea>
                </div>
            </div>

            <div class="settings-card">
                <h3>Skills</h3>

                <div class="skill-row">
                    <input type="text" id="skillInput" placeholder="Add skill">
                    <button id="addSkillBtn">Add</button>
                </div>

                <div id="skillTags"></div>
            </div>

            <div class="settings-card">
                <h3>Projects</h3>

                <div id="projectsList"></div>

                <button id="addProjectBtn" class="secondary-btn">
                    + Add Project
                </button>
            </div>

            <div class="settings-card">
                <h3>Social Links</h3>

                <div class="form-group">
                    <label>GitHub</label>
                    <input type="url" id="github">
                </div>

                <div class="form-group">
                    <label>LinkedIn</label>
                    <input type="url" id="linkedin">
                </div>

                <div class="form-group">
                    <label>X / Twitter</label>
                    <input type="url" id="twitter">
                </div>

                <div class="form-group">
                    <label>Website</label>
                    <input type="url" id="website">
                </div>
            </div>

            <div class="settings-card">
                <h3>Contact</h3>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="contactEmail">
                </div>

                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="location">
                </div>
            </div>

            <div class="settings-card">
                <h3>Theme</h3>

                <div id="themeGrid" class="theme-grid">

                    <button class="theme-btn active" data-theme="violet"></button>
                    <button class="theme-btn" data-theme="ocean"></button>
                    <button class="theme-btn" data-theme="forest"></button>
                    <button class="theme-btn" data-theme="sunset"></button>
                    <button class="theme-btn" data-theme="rose"></button>
                    <button class="theme-btn" data-theme="slate"></button>

                </div>
            </div>

            <button id="saveBtn2" class="save-btn full-width">
                Save Portfolio
            </button>

        </aside>

        <main class="editor-preview">

            <div class="preview-header" id="previewHeader">

                <div class="preview-avatar">

                    <img id="previewAvatarImg" alt="">

                    <span id="previewAvatarInitials">
                        W
                    </span>

                </div>

                <h2 id="previewName">
                    Your Name
                </h2>

                <p id="previewTitle">
                    Professional Title
                </p>

            </div>

            <section class="preview-section">

                <h3>About</h3>

                <p id="previewAbout">
                    Your bio will appear here.
                </p>

            </section>

            <section class="preview-section">

                <h3>Skills</h3>

                <div id="previewSkills"></div>

            </section>

            <section class="preview-section">

                <h3>Projects</h3>

                <div id="previewProjects"></div>

            </section>

        </main>

    </div>

</div>

<div id="toast"></div>

<script type="module" src="js/editor.js"></script>
<script type="module" src="js/global-nav.js"></script>

<script type="module" src="js/auth-check.js"></script>

</body>
</html>
